[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi4tc"
version = "0.1.0"
description = "Code and datasets for first-token tool-call experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = [
  "torch>=2.2",
  "transformers>=4.52.4",
]

[tool.setuptools.packages.find]
where = ["src"]
